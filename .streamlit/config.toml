# Tema del dashboard: oscuro con el amarillo taxi, el mismo estilo de la presentación.
# Streamlit lo lee de la carpeta desde donde se ejecuta; Start-Dashboard (urbanflow.ps1) entra en C:\UrbanFlow.
[theme]
base = "dark"
primaryColor = "#F5B700"
backgroundColor = "#0E1726"
secondaryBackgroundColor = "#16233A"
textColor = "#E6EDF7"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
