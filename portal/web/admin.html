<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UrbanFlow | Operación</title><link rel="stylesheet" href="/assets/style.css"><script type="module" src="/assets/admin.js"></script></head>
<body class="operations"><header><div class="brand">Urban<span>Flow</span></div><div>Operación del clúster</div></header><main>
<section class="intro"><h1>Estado del procesamiento</h1><p id="notice" role="status">Consultando el backend…</p></section>
<form class="toolbar" id="run"><label>Mes publicado<select id="month" required></select></label><button id="submit" disabled>Recalcular corredores</button></form>
<p id="message" role="status"></p>
<section class="section"><h2>Trabajos de UrbanFlow</h2><div id="jobs"></div></section>
<section class="section"><h2>Workers de YARN</h2><p class="muted">Recursos asignados a contenedores por YARN.</p><div class="scroll"><table><thead><tr><th>Nodo</th><th>Estado</th><th>Contenedores</th><th>Memoria asignada</th><th>vCores asignados</th></tr></thead><tbody id="nodes"></tbody></table></div></section>
<section class="section"><h2>Aplicaciones de YARN</h2><div class="scroll"><table><thead><tr><th>Aplicación</th><th>Estado</th><th>Progreso</th><th>Duración</th></tr></thead><tbody id="apps"></tbody></table></div></section>
</main></body></html>
